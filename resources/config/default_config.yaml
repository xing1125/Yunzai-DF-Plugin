# 此配置文件为系统使用，请勿修改，否则可能无法正常使用
# 用户配置已移动至 Yz/config/DF-Plugin.yaml

# Git仓库更新推送
CodeUpdate:
  AutoTips: |-
    自动检查仓库更新开关
  Auto: false
  CronTips: |-
    仓库更新检查Cron表达式
    Github/Gitee Api 未认证用户每小时限制60 (ip限制), 认证用户每小时限制5000次 (账号限制)
  Cron: "0 */30 * * * *"
  AutoBranchTips: |-
    是否自动给未配置分支的仓库添加默认分支
  AutoBranch: true
  FirstAddTips: |-
    首次添加仓库(数据库不存在数据库)是否进行一次推送
  FirstAdd: false
  badgeStyleTips: |-
    提交信息中是否启用徽章样式
  badgeStyle: true
  TranslateTips: |-
    是否在渲染Git仓库更新推送前，将提交信息和Release内容翻译为简体中文
    默认使用Google公共翻译接口，如网络无法访问可开启代理或修改TranslateApi
  Translate: false
  TranslateApiTips: |-
    翻译接口地址
    默认兼容Google公共翻译接口
    也支持包含 {text} / {q} / {target} 占位符的GET接口模板
  TranslateApi: "https://translate.googleapis.com/translate_a/single"
  TranslateNameTips: |-
    翻译后在推送图片中显示的提示名称
  TranslateName: "Google 翻译"
  multiPageTips: |-
    当获取到的数据达到多少条时分片发送，填 -1 关闭
  multiPage: 12
  timeFormatTips: |-
    时间格式
    1: 多久之前 x分钟前 X小时前
    2: 日期加时间 2023-01-01 00:00:00
    3: 自适应时分（非当日显示日期） 2023-01-01 00:00
  timeFormat: 1
  RepoTips: |-
    GitApi配置
      provider: 仓库提供商，唯一标识符
      token: 认证Token
      ApiUrl: Api地址
  repos:
    - provider: "GitHub"
      token: ""
      ApiUrl: "https://api.github.com/repos"
      icon: "GitHub"
      tips: Github个人Token 获取地址 https://github.com/settings/tokens
    - provider: "Gitee"
      token: ""
      ApiUrl: "https://gitee.com/api/v5/repos"
      icon: "Gitee"
      tips: Gitee个人Token 获取地址 https://gitee.com/profile/personal_access_tokens
    - provider: "Gitcode"
      token: ""
      ApiUrl: "https://gitcode.com/api/v5/repos"
      icon: "Gitcode"
      tips: Gitcode个人Token 获取地址 https://gitcode.com/setting/token-classic
    - provider: "CNB"
      token: ""
      ApiUrl: "https://api.cnb.cool"
      icon: "CNB"

  ListTips: |-
    推送配置
    Group: 推送的群聊列表
    QQ: 推送的QQ列表
    AutoPath: 是否自动获取已安装的插件地址并监听
    Exclude: 排除的仓库路径(用于忽略一些不希望被监听的插件)
    repos: 
        provider: 仓库提供商，唯一标识符
        repo: 仓库名
        branch: 分支名 (commits时有效 为空自动获取)
        type: commits 或 release
    note: 备注
  List: []

# 随机图片配置
Picture:
  openTips: |-
    随机图片总开关
  open: true
  apiPictureTips: |-
    随机Api图片开关
  apiPicture: true
  apiDisableTips: |-
    api表情禁用列表
  apiDisable: []

# 代理设置
proxy:
  openTips: |-
    是否代理大部分请求
  open: false
  urlTips: |-
    代理地址
  url: "http://127.0.0.1:7890"

# 其他配置
other:
  ysTips: |-
    原神关键词发图
  ys: true
  renderScaleTips: |-
    渲染精度
    范围 50~200
  renderScale: 100
